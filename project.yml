name: SpendTracker
options:
  bundleIdPrefix: com.maghizhan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  SpendTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpendTracker
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maghizhan.spendtracker
        PRODUCT_NAME: SpendTracker
        INFOPLIST_FILE: SpendTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpendTracker/SpendTracker.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: SpendTrackerWidget
      - package: Supabase
        product: Supabase
    info:
      path: SpendTracker/Info.plist
      properties:
        CFBundleDisplayName: Tabby
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.maghizhan.spendtracker
            CFBundleURLSchemes:
              - spendtracker

  SpendTrackerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpendTrackerWidget
      - path: Shared
      - path: SpendTracker/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maghizhan.spendtracker.SpendTrackerWidget
        PRODUCT_NAME: SpendTrackerWidget
        INFOPLIST_FILE: SpendTrackerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpendTrackerWidget/SpendTrackerWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: SpendTrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: Tabby
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SpendTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpendTrackerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maghizhan.spendtracker.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpendTracker

schemes:
  SpendTracker:
    build:
      targets:
        SpendTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpendTrackerTests
